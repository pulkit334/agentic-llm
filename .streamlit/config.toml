# Pleasant indigo theme. Light and dark both stay available (Settings -> Theme).
[theme]
primaryColor = "#4F46E5"
baseRadius = "medium"
font = "sans-serif"
showSidebarBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5FB"
textColor = "#1F2333"
borderColor = "#E3E5F0"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0F1220"
secondaryBackgroundColor = "#1A1E31"
textColor = "#E8EAF4"
borderColor = "#2C3150"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
